<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>FellowX · 同行社区 — 会员管理与激励系统</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="suzhi.css" />
<style>
  /* 顶栏 */
  .topbar {
    position: sticky; top: 0; z-index: 100; height: 60px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 22px; border-bottom: 1px solid var(--hairline);
    background: var(--surface-glass);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
  .nav-link {
    background: none; border: none; cursor: pointer; font-family: var(--font-body);
    font-size: 13.5px; font-weight: 500; color: var(--ink-2); padding: 8px 12px;
    border-radius: var(--r-sm); transition: color .15s, background .15s; white-space: nowrap;
  }
  .nav-link:hover { color: var(--ink); }
  .nav-link[data-on="true"] { color: var(--ink); font-weight: 600; background: var(--surface-sunk); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--hairline);
    background: var(--surface); cursor: pointer; display: grid; place-items: center;
    color: var(--ink-2); transition: all .15s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--hairline-strong); }
  /* 角色切换器 */
  .role-switch { display: flex; gap: 2px; background: var(--surface-sunk); border-radius: 999px; padding: 3px; }
  .role-switch button {
    height: 30px; padding: 0 13px; border: none; background: none; cursor: pointer; border-radius: 999px;
    font-family: var(--font-body); font-size: 12.5px; font-weight: 550; color: var(--ink-2); transition: all .18s;
    display: flex; align-items: center; gap: 6px;
  }
  .role-switch button[data-on="true"] { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(234,88,12,.3); }
  .mobile-nav { display: none; }
  @media (max-width: 760px) {
    .desktop-nav { display: none !important; }
    .role-switch button span.lbl { display: none; }
    .role-switch button { padding: 0 9px; }
    .brand-tag { display: none; }
  }
  /* 底部页脚 */
  .foot { border-top: 1px solid var(--hairline); padding: 28px; text-align: center; }
</style>
</head>
