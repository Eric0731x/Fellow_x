version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: fellowx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fellowx
      POSTGRES_PASSWORD: fellowx
      POSTGRES_DB: fellowx
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fellowx']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
